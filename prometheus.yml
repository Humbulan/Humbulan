global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9091']
  - job_name: 'pushgateway'
    honor_labels: true
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9092']
  - job_name: 'metrics_api'
    static_configs:
      - targets: ['localhost:5006']
  - job_name: 'sadc_exporter'
    static_configs:
      - targets: ['localhost:9102']
  - job_name: 'node_red_exporter'
    static_configs:
      - targets: ['localhost:8110']
  - job_name: 'webhook_8117'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:8117']
  - job_name: 'dssw_exporter'
    static_configs:
      - targets: ['localhost:9093']
  - job_name: 'cloudflare_edge_exporter'
    scheme: 'https'
    metrics_path: '/metrics'
    scrape_interval: 300s
    scrape_timeout: 30s
    static_configs:
      - targets: ['cloudflare-prometheus-exporter.getfriendhumbulani30.workers.dev']

rule_files:
  - "/data/data/com.termux/files/home/imperial_network/prometheus/imperial.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:8117']
