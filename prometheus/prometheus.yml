global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "imperial.rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9091"]

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["localhost:9092"]

  - job_name: "node_red_exporter"
    static_configs:
      - targets: ["localhost:8110"]

  - job_name: "sadc_exporter"
    static_configs:
      - targets: ["localhost:9102"]

  - job_name: "webhook_8117"
    static_configs:
      - targets: ["localhost:8117"]
    metrics_path: "/metrics"

  - job_name: 'cloudflare_edge_exporter'
    static_configs:
      - targets: ['cloudflare-prometheus-exporter.getfriendhumbulani30.workers.dev']
    metrics_path: '/metrics'
    scheme: 'https'
    scrape_interval: 300s
